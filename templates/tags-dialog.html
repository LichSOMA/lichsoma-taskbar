<div class="tags-dialog">
  <div class="tags-dialog-header">
    <span class="tags-dialog-title">{{headerTitle}}</span>
  </div>
  <div class="tags-bulk-editor">
    <input
      type="text"
      class="tags-bulk-input"
      id="tags-bulk-input"
      value="{{tagsValue}}"
      placeholder="{{tagPlaceholder}}"
      autocomplete="off"
    />
    <p class="tags-bulk-hint">{{tagHint}}</p>
  </div>
</div>
